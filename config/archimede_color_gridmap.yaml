grid:
  resolution: 0.05  # 5cm grid cells
  width: 10.0      # 10m width
  height: 10.0     # 10m height
  frame_id: "Archimede_foot_start"  # Target frame for the grid

detection:
  confidence_threshold: 100.0  # Minimum contour area to consider
  max_age: 5.0              # Maximum age of detections in seconds
  decay_rate: 0.1          # Rate at which confidence decays